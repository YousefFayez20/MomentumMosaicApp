name: App Pipeline
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile Project
        run: mvn clean compile
      - name: Run unit tests
        run: mvn test
      - name: Build backend Docker image
        run: |
          docker build \
          -t momentum-backend:test .
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./momentum-mosaic-dashboard

    steps:

      # STEP 1 — Checkout
      - name: Checkout repository
        uses: actions/checkout@v4



      # STEP 2 — Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './momentum-mosaic-dashboard/package-lock.json'



      # STEP 3 — Install dependencies
      - name: Install frontend packages
        run: npm ci



      # STEP 4 — Build Next.js
      - name: Build frontend
        run: npm run build



      # STEP 5 — Build Docker image
      - name: Build frontend Docker image
        run: |
          docker build \
          -t momentum-frontend:test .

        

    