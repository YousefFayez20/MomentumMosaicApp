version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: momentum-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysql -h 127.0.0.1 -P 3306 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s


  backend:
    build: .
    container_name: momentum-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}


  frontend:
    build: ./momentum-mosaic-dashboard
    container_name: momentum-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Browser requests
      NEXT_PUBLIC_API_URL: http://localhost:8080

      NEXT_PUBLIC_API_BASE_URL: momentummosaicapp-production.up.railway.app

      # Server-side requests
      INTERNAL_API_URL: http://backend:8080


volumes:
  mysqldata:
